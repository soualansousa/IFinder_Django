<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>iFinder</title>
    <style>
        body {
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .container h2 {
            color: #4CAF50;
        }
        .container a {
            display: block;
            margin: 10px 0;
            padding: 10px;
            color: #fff;
            background-color: #4CAF50;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>O que deseja fazer?</h2>
        {% comment %} <a href="{% url 'admin:app_list' 'your_app_label' %}">Ver lista de objetos pendentes</a>
        <a href="{% url 'admin:your_app_label_item_add' %}">Cadastrar que encontrei um objeto</a> {% endcomment %}
    </div>
</body>
</html>
