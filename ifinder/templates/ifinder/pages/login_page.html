{% extends 'global/base.html'%}

{% block title %} | Login{% endblock title %}
{% block content %}
    <h1 class="topo-login">Login</h1>
   <div class="display-menu-formulario"> 
        <form method="post">
            <div class="form-login">
                {% csrf_token %}
                {{ form.as_p }}
            </div>
            <div>
                <a class="password" href="#">Esqueceu a senha?</a>
            </div>
            <div>
                <button type="submit" class="botao-enviar">Login</button>
            </div>
         
        </form>
    </div>











{% endblock content %}
